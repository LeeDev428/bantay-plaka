<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plate Monitor — Bantay Plaka</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 24px;
      background: rgba(15,23,42,0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      z-index: 10;
    }
    #header span { font-weight: 600; color: #f8fafc; font-size: 15px; }
    #plate-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    #plate-label {
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    #plate-number {
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(4rem, 12vw, 10rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #f8fafc;
      border: 6px solid #334155;
      padding: 12px 36px;
      border-radius: 18px;
      background: #1e293b;
      min-width: 420px;
      text-align: center;
      transition: color 0.3s, border-color 0.3s, background 0.3s;
    }
    #plate-number.status-in  { color: #4ade80; border-color: #16a34a; background: #052e16; }
    #plate-number.status-out { color: #f87171; border-color: #dc2626; background: #2d0a0a; }
    #status-badge {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 28px;
      border-radius: 999px;
      background: #334155;
      color: #94a3b8;
    }
    #status-badge.status-in  { background: #14532d; color: #4ade80; }
    #status-badge.status-out { background: #450a0a; color: #f87171; }
    #name-line {
      font-size: 1.5rem;
      color: #cbd5e1;
      font-weight: 500;
      min-height: 2rem;
    }
    #timestamp { font-size: 0.95rem; color: #64748b; }
    #waiting {
      font-size: 2rem;
      color: #334155;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div id="header">
    <span>Bantay Plaka</span>
    <div>Plate Monitor &mdash; auto-refreshes every 3s</div>
  </div>

  <div id="plate-wrap">
    <div id="plate-label">Last Scanned Plate</div>
    {% if latest %}
      <div id="plate-number" class="status-{{ latest.status|lower }}">{{ latest.plate_number }}</div>
      <div id="status-badge" class="status-{{ latest.status|lower }}">{{ latest.get_status_display }}</div>
      <div id="name-line">{{ latest.resident_name|default:latest.visitor_name|default:'' }}</div>
      <div id="timestamp">{{ latest.timestamp|date:"M d, Y H:i:s" }}</div>
    {% else %}
      <div id="plate-number">—</div>
      <div id="status-badge">—</div>
      <div id="name-line"></div>
      <div id="timestamp"></div>
      <div id="waiting">Waiting for scan…</div>
    {% endif %}
  </div>

  <script>
  (function () {
    const plateEl = document.getElementById('plate-number');
    const badgeEl = document.getElementById('status-badge');
    const nameEl  = document.getElementById('name-line');
    const tsEl    = document.getElementById('timestamp');

    let lastTs = '{{ latest.timestamp.isoformat|default:"" }}';

    async function poll() {
      try {
        const res = await fetch('{% url "plate_monitor_latest" %}', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.plate) return;
        if (data.timestamp === lastTs) return;
        lastTs = data.timestamp;

        const statusClass = data.status === 'TIME_IN' ? 'status-in' : 'status-out';
        const statusLabel = data.status === 'TIME_IN' ? 'Time In' : 'Time Out';

        plateEl.textContent = data.plate;
        plateEl.className = statusClass;
        badgeEl.textContent = statusLabel;
        badgeEl.className = statusClass;
        nameEl.textContent = data.name || '';
        const d = new Date(data.timestamp);
        tsEl.textContent = d.toLocaleString();
      } catch (_) {}
    }

    setInterval(poll, 3000);
  })();
  </script>
</body>
</html>
