<h2 class="font-semibold text-slate-800 mb-4">7-Day Activity</h2>
<div class="h-64">
  <canvas id="dashboardActivityChart"></canvas>
</div>
<script>
(function () {
  const canvas = document.getElementById('dashboardActivityChart');
  if (!canvas) return;
  const data = {{ daily_data|safe }};

  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: data.map(day => day.label),
      datasets: [
        { label: 'Time In', data: data.map(day => day.time_in), backgroundColor: '#3b82f6', borderRadius: 4, barPercentage: 0.7 },
        { label: 'Time Out', data: data.map(day => day.time_out), backgroundColor: '#ef4444', borderRadius: 4, barPercentage: 0.7 },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { usePointStyle: true, pointStyle: 'circle', padding: 20, font: { size: 12 } }
        }
      },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 }, color: '#94a3b8' }, grid: { color: '#f1f5f9' } },
        x: { ticks: { font: { size: 11 }, color: '#94a3b8' }, grid: { display: false } }
      }
    }
  });
})();
</script>
