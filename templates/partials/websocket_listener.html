<script>
(function () {
  if (window.__bpWsListenerInitialized) return;
  window.__bpWsListenerInitialized = true;

  const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const socket = new WebSocket(`${protocol}://${window.location.host}/ws/logs/`);
  const tbody = document.getElementById('live-log-body');

  function showBlacklistAlert(data) {
    const old = document.getElementById('blacklist-alert-banner');
    if (old) old.remove();

    const banner = document.createElement('div');
    banner.id = 'blacklist-alert-banner';
    banner.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[9999] w-[92%] max-w-2xl rounded-xl border border-red-300 bg-red-50 shadow-lg';
    banner.innerHTML = `
      <div class="px-5 py-4">
        <div class="flex items-start gap-3">
          <i class="fa fa-triangle-exclamation text-red-600 text-2xl mt-0.5"></i>
          <div class="flex-1">
            <p class="text-red-700 font-bold text-lg leading-tight">${data.title || 'Blacklisted Vehicle Detected'}</p>
            <p class="text-red-700 text-sm mt-1">${data.message || ''}</p>
          </div>
          <button id="close-blacklist-alert" class="text-red-500 hover:text-red-700">
            <i class="fa fa-xmark text-lg"></i>
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(banner);

    const closeBtn = document.getElementById('close-blacklist-alert');
    if (closeBtn) closeBtn.onclick = () => banner.remove();

    setTimeout(() => {
      const current = document.getElementById('blacklist-alert-banner');
      if (current) current.remove();
    }, 9000);
  }

  function highlightRecentRows() {
    // Clear existing highlights
    tbody.querySelectorAll('tr.highlight-in, tr.highlight-out').forEach(r => {
      r.classList.remove('highlight-in', 'highlight-out');
    });
    // Find first TIME_IN and first TIME_OUT (rows are newest-first)
    const rows = tbody.querySelectorAll('tr[data-status]');
    let foundIn = false, foundOut = false;
    rows.forEach(r => {
      if (!foundIn && r.dataset.status === 'TIME_IN') {
        r.classList.add('highlight-in');
        foundIn = true;
      } else if (!foundOut && r.dataset.status === 'TIME_OUT') {
        r.classList.add('highlight-out');
        foundOut = true;
      }
    });
  }

  function updateFeedCard(role, data) {
    const prefix = role === 'ENTRY_CAM' ? 'entry' : role === 'EXIT_CAM' ? 'exit' : null;
    if (!prefix || !data.snapshot_url) return;

    const img = document.getElementById(`${prefix}-feed-image`);
    const empty = document.getElementById(`${prefix}-feed-empty`);
    const meta = document.getElementById(`${prefix}-feed-meta`);

    if (!img || !meta) return;

    if (img.dataset.liveStream === 'true') {
      // True live video mode: do not replace stream with snapshots.
      meta.textContent = `Latest detection: Plate ${data.plate_number} - ${data.timestamp}`;
      return;
    }

    // Non-live fallback (no RTSP configured): keep latest snapshot visible.
    img.src = `${data.snapshot_url}?t=${Date.now()}`;
    img.classList.remove('hidden');
    if (empty) empty.classList.add('hidden');
    meta.textContent = `Latest detection: Plate ${data.plate_number} - ${data.timestamp}`;
  }

  socket.onmessage = function (e) {
    const data = JSON.parse(e.data);

    if (data.event_type === 'blacklist_alert') {
      showBlacklistAlert(data);
      return;
    }

    const typeBadge = data.entry_type === 'RESIDENT'
      ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">Resident</span>'
      : data.entry_type === 'VISITOR'
        ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">Visitor</span>'
        : '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600">Unknown</span>';

    const statusBadge = data.status === 'TIME_IN'
      ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700"><i class="fa fa-arrow-right text-[9px]"></i> IN</span>'
      : '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700"><i class="fa fa-arrow-left text-[9px]"></i> OUT</span>';

    const sourceBadge = data.source === 'MANUAL'
      ? '<span class="inline-flex items-center gap-1 text-xs text-slate-500"><i class="fa fa-keyboard text-[10px]"></i> Manual</span>'
      : '<span class="inline-flex items-center gap-1 text-xs text-emerald-600"><i class="fa fa-camera text-[10px]"></i> Camera</span>';

    const row = document.createElement('tr');
    row.id = `log-row-${data.id}`;
    row.dataset.status = data.status;
    row.classList.add('transition-colors');
    row.innerHTML = `
      <td class="font-mono font-semibold text-slate-800">${data.plate_number}</td>
      <td class="text-sm text-slate-600">${data.display_name}</td>
      <td>${typeBadge}</td>
      <td>${statusBadge}</td>
      <td>${sourceBadge}</td>
      <td class="text-xs text-slate-400">${data.timestamp}</td>
    `;

    const emptyRow = tbody.querySelector('td[colspan]');
    if (emptyRow) emptyRow.closest('tr').remove();

    tbody.insertBefore(row, tbody.firstChild);
    // Re-run highlights after inserting new row
    highlightRecentRows();
    updateFeedCard(data.camera_role, data);
  };

  socket.onopen = () => console.log('[BantayPlaka] WebSocket connected.');
  socket.onclose = () => console.warn('[BantayPlaka] WebSocket disconnected.');

  function startSnapshotRefresh() {
    if (window.__bpSnapshotRefreshStarted) return;
    window.__bpSnapshotRefreshStarted = true;

    const refreshTargets = document.querySelectorAll('img[data-live-snapshot]');
    if (!refreshTargets.length) return;
    refreshTargets.forEach((img) => {
      const role = img.dataset.liveSnapshot;
      if (!role) return;
      const prefix = role === 'ENTRY_CAM' ? 'entry' : role === 'EXIT_CAM' ? 'exit' : null;
      const empty = prefix ? document.getElementById(`${prefix}-feed-empty`) : null;
      const meta = prefix ? document.getElementById(`${prefix}-feed-meta`) : null;

      let busy = false;
      let failures = 0;
      setInterval(() => {
        if (img.dataset.liveSnapshot !== role) return;
        if (busy) return;
        busy = true;
        const probe = new Image();
        probe.onload = () => {
          img.src = probe.src;
          img.classList.remove('hidden');
          if (empty) empty.classList.add('hidden');
          failures = 0;
          busy = false;
        };
        probe.onerror = () => {
          failures += 1;
          if (failures >= 2) {
            img.classList.add('hidden');
            if (empty) {
              empty.textContent = 'Camera unavailable. Check power/network/IP settings.';
              empty.classList.remove('hidden');
            }
            if (meta) {
              meta.textContent = `Waiting for ${role} stream...`;
            }
          }
          busy = false;
        };
        probe.src = `/detection/frame/${role}/?t=${Date.now()}`;
      }, 300);
    });
  }

  // Highlight on initial page load
  document.addEventListener('DOMContentLoaded', highlightRecentRows);
  document.addEventListener('DOMContentLoaded', startSnapshotRefresh);
})();
</script>
