<script>
(function () {
  if (window.__bpWsListenerInitialized) return;
  window.__bpWsListenerInitialized = true;

  const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const socket = new WebSocket(`${protocol}://${window.location.host}/ws/logs/`);
  const tbody = document.getElementById('live-log-body');

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function showBlacklistAlert(data) {
    const old = document.getElementById('blacklist-alert-banner');
    if (old) old.remove();

    const banner = document.createElement('div');
    banner.id = 'blacklist-alert-banner';
    banner.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[9999] w-[92%] max-w-2xl rounded-xl border border-red-300 bg-red-50 shadow-lg';
    banner.innerHTML = `
      <div class="px-5 py-4">
        <div class="flex items-start gap-3">
          <i class="fa fa-triangle-exclamation text-red-600 text-2xl mt-0.5"></i>
          <div class="flex-1">
            <p class="text-red-700 font-bold text-lg leading-tight">${data.title || 'Blacklisted Vehicle Detected'}</p>
            <p class="text-red-700 text-sm mt-1">${data.message || ''}</p>
          </div>
          <button id="close-blacklist-alert" class="text-red-500 hover:text-red-700">
            <i class="fa fa-xmark text-lg"></i>
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(banner);

    const closeBtn = document.getElementById('close-blacklist-alert');
    if (closeBtn) closeBtn.onclick = () => banner.remove();

    setTimeout(() => {
      const current = document.getElementById('blacklist-alert-banner');
      if (current) current.remove();
    }, 9000);
  }

  function highlightRecentRows() {
    // Clear existing highlights
    tbody.querySelectorAll('tr.highlight-in, tr.highlight-out').forEach(r => {
      r.classList.remove('highlight-in', 'highlight-out');
    });
    // Find first TIME_IN and first TIME_OUT (rows are newest-first)
    const rows = tbody.querySelectorAll('tr[data-status]');
    let foundIn = false, foundOut = false;
    rows.forEach(r => {
      if (!foundIn && r.dataset.status === 'TIME_IN') {
        r.classList.add('highlight-in');
        foundIn = true;
      } else if (!foundOut && r.dataset.status === 'TIME_OUT') {
        r.classList.add('highlight-out');
        foundOut = true;
      }
    });
  }

  function showDetectionToast(data) {
    const old = document.getElementById('detection-toast');
    if (old) old.remove();
    const statusLabel = data.status === 'TIME_IN' ? 'IN' : 'OUT';
    const camLabel = data.camera_role === 'ENTRY_CAM' ? 'Entry' : data.camera_role === 'EXIT_CAM' ? 'Exit' : (data.camera_role || 'Camera');
    const bgColor = data.status === 'TIME_IN' ? 'bg-blue-50 border-blue-200' : 'bg-red-50 border-red-200';
    const iconColor = data.status === 'TIME_IN' ? 'text-blue-500' : 'text-red-500';
    const toast = document.createElement('div');
    toast.id = 'detection-toast';
    toast.className = `fixed bottom-4 right-4 z-[9998] w-80 rounded-xl border shadow-lg ${bgColor}`;
    toast.innerHTML = `
      <div class="px-4 py-3 flex items-start gap-3">
        <i class="fa fa-camera ${iconColor} text-xl mt-0.5"></i>
        <div class="flex-1 min-w-0">
          <p class="font-bold text-slate-800 text-sm">Plate Detected: ${escapeHtml(data.plate_number)}</p>
          <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(camLabel)} Cam &bull; ${escapeHtml(statusLabel)} &bull; ${escapeHtml(data.timestamp)}</p>
        </div>
        <button onclick="document.getElementById('detection-toast')?.remove()" class="text-slate-400 hover:text-slate-600"><i class="fa fa-xmark"></i></button>
      </div>
    `;
    document.body.appendChild(toast);
    setTimeout(() => { const t = document.getElementById('detection-toast'); if (t) t.remove(); }, 5000);
  }

  function updateFeedCard(role, data) {
    const prefix = role === 'ENTRY_CAM' ? 'entry' : role === 'EXIT_CAM' ? 'exit' : null;
    if (!prefix || !data.snapshot_url) return;

    const img = document.getElementById(`${prefix}-feed-image`);
    const empty = document.getElementById(`${prefix}-feed-empty`);
    const meta = document.getElementById(`${prefix}-feed-meta`);

    if (!img || !meta) return;

    // For direct RTSP stream mode, only update the meta label (the stream handles the image).
    if (img.dataset.liveStream === 'true') {
      meta.textContent = `Latest detection: Plate ${data.plate_number} - ${data.timestamp}`;
      return;
    }

    // Cloud/snapshot mode (data-live-snapshot): update img.src with the annotated detection frame.
    img.src = `${data.snapshot_url}?t=${Date.now()}`;
    img.classList.remove('hidden');
    if (empty) empty.classList.add('hidden');
    meta.textContent = `Latest detection: Plate ${data.plate_number} - ${data.timestamp}`;
  }

  socket.onmessage = function (e) {
    const data = JSON.parse(e.data);

    if (data.event_type === 'blacklist_alert') {
      showBlacklistAlert(data);
      return;
    }

    // Live camera heartbeat frame: update image immediately via WebSocket push.
    if (data.event_type === 'camera_frame_update') {
      const role = data.camera_role;
      const prefix = role === 'ENTRY_CAM' ? 'entry' : role === 'EXIT_CAM' ? 'exit' : null;
      if (prefix) {
        const img = document.getElementById(`${prefix}-feed-image`);
        const meta = document.getElementById(`${prefix}-feed-meta`);
        const empty = document.getElementById(`${prefix}-feed-empty`);
        if (img) {
          if (data.snapshot_b64) {
            img.src = `data:image/jpeg;base64,${data.snapshot_b64}`;
          } else if (data.snapshot_url) {
            // Fallback for older payloads / persistent snapshot URL.
            img.src = data.snapshot_url + '?t=' + Date.now();
          }
          img.classList.remove('hidden');
          if (empty) empty.classList.add('hidden');
        }
        if (meta) meta.textContent = 'Live frame update: ' + data.timestamp;
      }
      return;
    }

    const typeBadge = data.entry_type === 'RESIDENT'
      ? '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">Resident</span>'
      : '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">Visitor</span>';

    const safeTag = escapeHtml(data.blacklist_tag_display || (data.blacklist_tag || '').replace('_', ' '));
    const safeRemarks = escapeHtml(data.blacklist_remarks || '');
    const safePlate = escapeHtml(data.plate_number || '');
    const safeDisplayName = escapeHtml(data.display_name || '');
    const safeTimestamp = escapeHtml(data.timestamp || '');

    const blacklistCell = data.blacklist_tag
      ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-red-100 text-red-700">${safeTag}</span>${data.blacklist_remarks ? `<p class="text-[11px] text-red-600 mt-1 max-w-[220px] truncate" title="${safeRemarks}">${safeRemarks}</p>` : ''}`
      : '<span class="text-xs text-slate-400">No remarks</span>';

    const statusBadge = data.status === 'TIME_IN'
      ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700"><i class="fa fa-arrow-right text-[9px]"></i> IN</span>'
      : '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700"><i class="fa fa-arrow-left text-[9px]"></i> OUT</span>';

    const sourceBadge = data.source === 'MANUAL'
      ? '<span class="inline-flex items-center gap-1 text-xs text-slate-500"><i class="fa fa-keyboard text-[10px]"></i> Manual</span>'
      : '<span class="inline-flex items-center gap-1 text-xs text-emerald-600"><i class="fa fa-camera text-[10px]"></i> Camera</span>';

    const row = document.createElement('tr');
    row.id = `log-row-${data.id}`;
    row.dataset.status = data.status;
    row.classList.add('transition-colors');
    row.innerHTML = `
      <td class="font-mono font-semibold text-slate-800">${safePlate}</td>
      <td class="text-sm text-slate-600">${safeDisplayName}</td>
      <td>${typeBadge}</td>
      <td>${blacklistCell}</td>
      <td>${statusBadge}</td>
      <td>${sourceBadge}</td>
      <td class="text-xs text-slate-400">${safeTimestamp}</td>
    `;

    const emptyRow = tbody.querySelector('td[colspan]');
    if (emptyRow) emptyRow.closest('tr').remove();

    tbody.insertBefore(row, tbody.firstChild);
    // Re-run highlights after inserting new row
    highlightRecentRows();
    updateFeedCard(data.camera_role, data);
    showDetectionToast(data);
  };

  socket.onopen = () => console.log('[BantayPlaka] WebSocket connected.');
  socket.onclose = () => console.warn('[BantayPlaka] WebSocket disconnected.');

  function startSnapshotRefresh() {
    if (window.__bpSnapshotRefreshStarted) return;
    window.__bpSnapshotRefreshStarted = true;

    const refreshTargets = document.querySelectorAll('img[data-live-snapshot]');
    if (!refreshTargets.length) return;
    refreshTargets.forEach((img) => {
      const role = img.dataset.liveSnapshot;
      if (!role) return;
      const prefix = role === 'ENTRY_CAM' ? 'entry' : role === 'EXIT_CAM' ? 'exit' : null;
      const empty = prefix ? document.getElementById(`${prefix}-feed-empty`) : null;
      const meta = prefix ? document.getElementById(`${prefix}-feed-meta`) : null;

      // Non-RTSP snapshot mode: image updates are driven by WebSocket camera_frame_update events.
      // Only keep the polling loop for direct RTSP stream mode (data-live-stream=true).
      if (img.dataset.liveStream !== 'true') {
        // Just ensure the initial image is visible if it has a src already.
        if (img.src && img.src !== window.location.href) {
          img.classList.remove('hidden');
          if (empty) empty.classList.add('hidden');
        }
        return;
      }

      let busy = false;
      let failures = 0;
      let hadSuccess = false;

      img.addEventListener('error', () => {
        img.dataset.liveStream = 'false';
        if (meta) {
          meta.textContent = `Switching ${role} to snapshot mode...`;
        }
      });

      setInterval(() => {
        if (img.dataset.liveStream === 'true') return;
        if (busy) return;
        busy = true;
        const probe = new Image();
        probe.onload = () => {
          img.src = probe.src;
          img.classList.remove('hidden');
          if (empty) empty.classList.add('hidden');
          hadSuccess = true;
          failures = 0;
          busy = false;
        };
        probe.onerror = () => {
          failures += 1;
          if (!hadSuccess && failures >= 6) {
            img.classList.add('hidden');
            if (empty) {
              empty.textContent = 'Camera unavailable. Check power/network/IP settings.';
              empty.classList.remove('hidden');
            }
          }
          if (hadSuccess && failures >= 10 && meta) {
            meta.textContent = `Reconnecting ${role} feed...`;
          }
          busy = false;
        };
        probe.src = `/detection/frame/${role}/?t=${Date.now()}`;
      }, 140);
    });
  }

  // Live real-time clock shown below each camera feed card.
  function startLiveClocks() {
    const clockIds = ['entry-live-clock', 'exit-live-clock'];
    function tick() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      let h = now.getHours();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      const timeStr = `${pad(h)}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ampm}`;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const dateStr = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
      const label = `${dateStr} ${timeStr}`;
      clockIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = label;
      });
    }
    tick();
    setInterval(tick, 1000);
  }

  // Highlight on initial page load — run immediately if DOM already ready, otherwise wait.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      highlightRecentRows();
      startSnapshotRefresh();
      startLiveClocks();
    });
  } else {
    highlightRecentRows();
    startSnapshotRefresh();
    startLiveClocks();
  }
})();
</script>
