{% extends 'base.html' %}
{% block title %}Reset Email Sent{% endblock %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-7 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 mb-3">
      <i class="fa fa-envelope"></i>
    </div>
    <h1 class="text-2xl font-bold text-slate-800">Check Your Email</h1>
    <p class="text-sm text-slate-500 mt-2">
      If the email exists in our system, a password reset link has been sent.
    </p>
    <a href="{% url 'login' %}" class="btn btn-sm mt-5 bg-slate-900 hover:bg-slate-800 border-0 text-white">Back to Login</a>
  </div>
</div>
{% endblock %}
