{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-7">
    <h1 class="text-2xl font-bold text-slate-800">Forgot Password</h1>
    <p class="text-sm text-slate-500 mt-1">Enter your account email to receive a reset link.</p>

    <form method="post" class="mt-6 space-y-4" novalidate>
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
        <input
          type="email"
          name="email"
          id="id_email"
          value="{{ form.email.value|default:'' }}"
          class="input input-bordered w-full"
          required
        >
        {% if form.email.errors %}
          <p class="text-red-500 text-xs mt-1">{{ form.email.errors.0 }}</p>
        {% endif %}
      </div>

      <button type="submit" class="btn w-full bg-slate-900 hover:bg-slate-800 border-0 text-white">
        Send Reset Link
      </button>
    </form>

    <a href="{% url 'login' %}" class="inline-flex items-center gap-2 mt-5 text-sm font-semibold text-blue-700 hover:text-blue-800">
      <i class="fa fa-arrow-left"></i> Back to Login
    </a>
  </div>
</div>
{% endblock %}
